schema_version: 1
packages:
  - name: mass-runtime-gateway-llama-cpp
    kind: runtime
    runtime_name: llama-cpp
    display_name: llama.cpp
    description: |
      Runtime gateway for llama.cpp-family inference workers (mass-worker-llama-cpp).
      Serves chat, embed, tokenize via typed API and OpenAI-compatible shim.
    versions:
      - version: 0.1.0
        # Upper bound: 0.2.0 dropped default_cost_axis from InitResponse, which
        # MASS 0.1.x requires non-empty — the two lines are not interchangeable.
        mass: ">=0.1 <0.2"
        artifacts:  # key: os/arch
          linux/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.1.0/mass-runtime-gateway-llama-cpp_linux_amd64.mass
