schema_version: 1
packages:
  - name: mass-runtime-gateway-llama-cpp
    kind: runtime
    runtime_name: llama-cpp
    display_name: llama.cpp
    description: |
      Runtime gateway for llama.cpp-family inference workers (mass-worker-llama-cpp).
      Serves chat, embed, tokenize via typed API and OpenAI-compatible shim.
    versions:
      - version: 0.1.0
        # Upper bound: 0.2.0 dropped default_cost_axis from InitResponse, which
        # MASS 0.1.x requires non-empty — the two lines are not interchangeable.
        mass: ">=0.1 <0.2"
        artifacts:  # key: os/arch
          linux/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.1.0/mass-runtime-gateway-llama-cpp_linux_amd64.mass
            sha256: 7b8c748b9e7d9eebd03a4ede2d251ef4de6750060b2ba255da537fc2056e8644
          windows/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.1.0/mass-runtime-gateway-llama-cpp_windows_amd64.mass
            sha256: 900c2387add6a9cfb1aebc1fd2866485cb69545b812311f8a36dc3150f2f3128
          darwin/arm64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.1.0/mass-runtime-gateway-llama-cpp_darwin_arm64.mass
            sha256: f525ceb6b9cdd714b8b6adc826819b1e92aa537dae0f17f096a232335634614b
      - version: 0.2.0
        # Upper bound: MASS 0.3.0 negotiates the gateway wire protocol at Init
        # and rejects a gateway that names none, which pre-0.3 gateways do.
        mass: ">=0.2 <0.3"
        artifacts:  # key: os/arch
          linux/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.2.0/mass-runtime-gateway-llama-cpp_linux_amd64.mass
            sha256: f91691d0c0e89ca4909bb0e875128920166ce9da67da0b9725b0c88a879914c8
          windows/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.2.0/mass-runtime-gateway-llama-cpp_windows_amd64.mass
            sha256: 9468200e4915b88c86cb9fbc7361aba2e68b210986a65a9b36ab18a3c1ecd4ec
          darwin/arm64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.2.0/mass-runtime-gateway-llama-cpp_darwin_arm64.mass
            sha256: 73693ec25bc19f38732c5bb0964a44cf669ba83ea3098542f9fcdba36423edc6
      # First build whose manifest/runtime.yml carries the real version. 0.1.0
      # and 0.2.0 both report "0.1.0" to MASS, so the Runtimes tab could not
      # tell them apart. Pairs with worker 0.2.1, which is the first worker
      # whose compatible range covers a runtime that says 0.2.x.
      - version: 0.2.1
        mass: ">=0.2 <0.3"  # same wire-protocol upper bound as 0.2.0
        artifacts:  # key: os/arch
          linux/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.2.1/mass-runtime-gateway-llama-cpp_linux_amd64.mass
            sha256: cbf48b8d7948076df7c1379d6efa5c96d1a5a6fe9d13ede03679e1d6d1ba13d5
          windows/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.2.1/mass-runtime-gateway-llama-cpp_windows_amd64.mass
            sha256: 8f2bfa0798a68aac8dcd63fe075ccb743824bed38160ca7771a6d8079be8606b
          darwin/arm64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.2.1/mass-runtime-gateway-llama-cpp_darwin_arm64.mass
            sha256: cb4faf00756037a05075b65e091270ddde77ca4ec02382cad2dfeae64fb78ddb
      # First generation with negotiated wire protocols: pairs with worker
      # 0.3.0 and MASS 0.3.0, which rejects protocol-less peers.
      - version: 0.3.0
        mass: ">=0.3"
        artifacts:  # key: os/arch
          linux/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.3.0/mass-runtime-gateway-llama-cpp_linux_amd64.mass
            sha256: 45456056983527f0219faa61c7d9fac781b6e50690c14dbd5b12ec2d3143576e
          windows/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.3.0/mass-runtime-gateway-llama-cpp_windows_amd64.mass
            sha256: db49ae0d0efe819950420d388f0071de45cf5343100906476f30f2d220f3a754
          darwin/arm64:
            url: https://github.com/chinese-room-solutions/mass-runtime-gateway-llama-cpp/releases/download/v0.3.0/mass-runtime-gateway-llama-cpp_darwin_arm64.mass
            sha256: be2ea76638dabd98753ef6ae556e86adb9f6533bdfe22597663df170dfeea70c
      # Exits when MASS does, so a MASS that dies without stopping it no longer
      # leaves a gateway holding a model resident. Wire protocols and payloads
      # are unchanged from 0.3.0. URLs carry the repo's current name; the rows
      # above predate its rename and GitHub still redirects those.
      - version: 0.4.0
        mass: ">=0.3"
        artifacts:  # key: os/arch
          linux/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-llama-cpp/releases/download/v0.4.0/mass-runtime-gateway-llama-cpp_linux_amd64.mass
            sha256: edf46d0b3186e8d1388135013d60a24db4097dde5d309b35965f5beb26a2bb58
          windows/amd64:
            url: https://github.com/chinese-room-solutions/mass-runtime-llama-cpp/releases/download/v0.4.0/mass-runtime-gateway-llama-cpp_windows_amd64.mass
            sha256: bac175713bdaa4cebdf319734235bf23699e1b239de010e3e8e6aeef59c3d579
          darwin/arm64:
            url: https://github.com/chinese-room-solutions/mass-runtime-llama-cpp/releases/download/v0.4.0/mass-runtime-gateway-llama-cpp_darwin_arm64.mass
            sha256: f0571042d11e34d3cb5b9a42e379a2d85ae29e6aa0b986b8fe2b7a1d365dbdbe

  - name: mass-worker-llama-cpp
    kind: worker
    runtime_name: llama-cpp
    display_name: llama.cpp
    description: |
      Native llama.cpp inference worker. Registry artifact is the raw
      self-contained installer (mass-worker-setup, non-container binary).
      GPU backend is Metal on Apple Silicon, Vulkan (cross-vendor) elsewhere.
    versions:
      - version: 0.1.0
        runtime: ">=0.1 <0.2"  # runtime versions whose payloads it decodes
        # Upper bound: 0.2.0 added the model-benchmark hub exchange and the
        # pinned pool size, neither of which MASS 0.1.x drives.
        mass: ">=0.1 <0.2"  # MASS server versions it speaks the hub protocol to
        artifacts:  # key: os/arch/backend
          linux/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.1.0/mass-worker-setup_linux_amd64
            sha256: 84a6c40679347a52580e2b0d6d86f7bf6f71d73bb0c98a62d92aa71c73f5dab7
          darwin/arm64/metal:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.1.0/mass-worker-setup_darwin_arm64
            sha256: eb1451aa1f24162a023d7ab4b96e6740ac6b0d21e2983a7a6e55cbd16ea8a14f
          windows/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.1.0/mass-worker-setup_windows_amd64.exe
            sha256: 9fd87ca8c9188e79d93e5e47a1c0cf92e19a40f362a37aa69e6b77e87795aacd
      - version: 0.2.0
        # 0.1.x, not 0.2.x: the 0.2.0 gateway shipped with its manifest still
        # reading 0.1.0, and this build's own kCompatibleRuntimes matches that.
        # Both are corrected in 0.2.1 — this row describes what 0.2.0 does.
        runtime: ">=0.1 <0.2"  # runtime versions whose payloads it decodes
        # Upper bound: MASS 0.3.0 negotiates the hub wire protocol at Register
        # and rejects a worker that names none, which pre-0.3 workers do.
        mass: ">=0.2 <0.3"  # MASS server versions it speaks the hub protocol to
        artifacts:  # key: os/arch/backend
          linux/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.2.0/mass-worker-setup_linux_amd64
            sha256: a6f02e0c2e5bf1d80fe565c9d23fd6f8c89ed8447132ee1766f516d0803979dd
          darwin/arm64/metal:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.2.0/mass-worker-setup_darwin_arm64
            sha256: 997fae1955acabcec3d14bd69aa93687342dda8f9a4e253fe4ced1df2b8445d2
          windows/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.2.0/mass-worker-setup_windows_amd64.exe
            sha256: 5cf85491c194cd54eb6380458d5b9f131cefba005b514591f6aec6d956ec3f84
      # First build that reports its own version truthfully (0.1.0 and 0.2.0
      # both say "0.1.0") and the first whose compatible range covers a
      # runtime reporting 0.2.x. Requires runtime 0.2.1: against the older
      # gateways, which report 0.1.0, MASS rejects it at Register.
      - version: 0.2.1
        runtime: ">=0.2 <0.3"  # runtime versions whose payloads it decodes
        mass: ">=0.2 <0.3"  # same wire-protocol upper bound as 0.2.0
        artifacts:  # key: os/arch/backend
          linux/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.2.1/mass-worker-setup_linux_amd64
            sha256: dd4120636a93c0f451151eb579996ab5e2385731acf7941b533e485bf46a5089
          darwin/arm64/metal:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.2.1/mass-worker-setup_darwin_arm64
            sha256: 6763d8a30e156dd5397fcd525cfa870619f62fbe73e1255dd54d0256403cbe2a
          windows/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.2.1/mass-worker-setup_windows_amd64.exe
            sha256: d11cb7c3323c26dfd35f4f6a8e3707243ab5243da721c7ba0014be28ac56671e
      # First generation with a negotiated hub wire protocol: requires MASS
      # 0.3.0, which in turn loads only 0.3.x gateways, so older runtimes are
      # unreachable from any MASS this worker can register with.
      - version: 0.3.0
        # Covers runtime 0.4.x too: 0.4.0 changed only the gateway's own
        # shutdown, leaving the payloads this decodes identical to 0.3.0's.
        runtime: ">=0.3 <0.5"  # runtime versions whose payloads it decodes
        mass: ">=0.3"  # MASS server versions it speaks the hub protocol to
        artifacts:  # key: os/arch/backend
          linux/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.3.0/mass-worker-setup_linux_amd64
            sha256: fc6c70fb15f3d45d8dd338c3d4123807a1290364175d33f60d42ddafed394294
          darwin/arm64/metal:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.3.0/mass-worker-setup_darwin_arm64
            sha256: c8518b205870a28953d7551629d37973db6c3efc8ca6893a31709a23d42f7a90
          windows/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.3.0/mass-worker-setup_windows_amd64.exe
            sha256: 14afa54b66b19d676d3b50a90860ba52a68f015a6bc0e71f3b68866017fa4c99

