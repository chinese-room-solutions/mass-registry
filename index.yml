  - name: mass-worker-llama-cpp
    kind: worker
    runtime_name: llama-cpp
    display_name: llama.cpp
    description: |
      Native llama.cpp inference worker. Registry artifact is the raw
      self-contained installer (mass-worker-setup, non-container binary).
      GPU backend is Metal on Apple Silicon, Vulkan (cross-vendor) elsewhere.
    versions:
      - version: 0.1.0
        runtime: ">=0.1 <0.2"  # runtime versions whose payloads it decodes
        mass: ">=0.1"  # MASS server versions it speaks the hub protocol to
        artifacts:  # key: os/arch/backend
          linux/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.1.0/mass-worker-setup_linux_amd64
            sha256: 84a6c40679347a52580e2b0d6d86f7bf6f71d73bb0c98a62d92aa71c73f5dab7
          darwin/arm64/metal:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.1.0/mass-worker-setup_darwin_arm64
