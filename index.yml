          windows/amd64/vulkan:
            url: https://github.com/chinese-room-solutions/mass-worker-llama-cpp/releases/download/v0.1.0/mass-worker-setup_windows_amd64.exe
            sha256: 9fd87ca8c9188e79d93e5e47a1c0cf92e19a40f362a37aa69e6b77e87795aacd

